name: scoutset
description: Base escalavel do aplicativo ScoutSet para volei, analise e performance.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  diacritic: ^0.1.6
  drift: ^2.28.1
  google_fonts: ^6.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.1.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/images/logo_scoutset.png
    - assets/data/rules_official_catalog.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_scoutset.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#081426"
  adaptive_icon_background: "#081426"
  adaptive_icon_foreground: assets/images/logo_scoutset.png
